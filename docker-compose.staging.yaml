# ChatsSync — STAGING
#
# Production ki exact copy, sirf teen farak:
#   1. sirf build: .  (koi image: nahi) → har deploy pe new-ui se build hoga
#   2. apna postgres + redis     → production ke database ko chhuta hi nahi
#   3. SMTP / Firebase nikale    → staging se koi asli email ya push nahi jayega
#
# Coolify: Docker Compose build pack, compose file = docker-compose.staging.yaml

services:
  chatwoot:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - redis
    environment:
      - SERVICE_URL_CHATWOOT_3000
      - SECRET_KEY_BASE=$SERVICE_PASSWORD_CHATWOOT
      - 'FRONTEND_URL=${SERVICE_URL_CHATWOOT}'
      - 'DEFAULT_LOCALE=${CHATWOOT_DEFAULT_LOCALE}'
      - 'FORCE_SSL=${FORCE_SSL:-false}'
      - 'ENABLE_ACCOUNT_SIGNUP=${ENABLE_ACCOUNT_SIGNUP:-true}'
      - 'REDIS_URL=redis://default@redis:6379'
      - REDIS_PASSWORD=$SERVICE_PASSWORD_REDIS
      - 'REDIS_OPENSSL_VERIFY_MODE=${REDIS_OPENSSL_VERIFY_MODE:-none}'
      - 'POSTGRES_DATABASE=${POSTGRES_DB:-chatwoot}'
      - 'POSTGRES_HOST=${POSTGRES_HOST:-postgres}'
      - POSTGRES_USERNAME=$SERVICE_USER_POSTGRES
      - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
      - 'RAILS_MAX_THREADS=${RAILS_MAX_THREADS:-5}'
      - 'NODE_ENV=${NODE_ENV:-production}'
      - 'RAILS_ENV=${RAILS_ENV:-production}'
      - 'INSTALLATION_ENV=${INSTALLATION_ENV:-docker}'
      - 'INSTALLATION_NAME=${INSTALLATION_NAME:-ChatsSync Staging}'
      - 'BRAND_NAME=${BRAND_NAME:-ChatsSync Staging}'
      - 'ACTIVE_STORAGE_SERVICE=${ACTIVE_STORAGE_SERVICE:-local}'
      - 'SAFE_FETCH_ALLOW_PRIVATE_NETWORK=${SAFE_FETCH_ALLOW_PRIVATE_NETWORK:-false}'
      - 'FB_APP_ID=${FB_APP_ID}'
      - 'FB_APP_SECRET=${FB_APP_SECRET}'
      - 'FB_VERIFY_TOKEN=${FB_VERIFY_TOKEN}'
      - 'IG_VERIFY_TOKEN=${IG_VERIFY_TOKEN}'
    entrypoint: docker/entrypoints/rails.sh
    command: 'sh -c "bundle exec rails db:chatwoot_prepare && bundle exec rails s -p 3000 -b 0.0.0.0"'
    volumes:
      - 'staging-rails-data:/app/storage'
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - 'http://127.0.0.1:3000'
      interval: 5s
      timeout: 20s
      retries: 10

  sidekiq:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - chatwoot
      - postgres
      - redis
    environment:
      - SECRET_KEY_BASE=$SERVICE_PASSWORD_CHATWOOT
      - 'FRONTEND_URL=${SERVICE_URL_CHATWOOT}'
      - 'DEFAULT_LOCALE=${CHATWOOT_DEFAULT_LOCALE}'
      - 'FORCE_SSL=${FORCE_SSL:-false}'
      - 'ENABLE_ACCOUNT_SIGNUP=${ENABLE_ACCOUNT_SIGNUP:-true}'
      - 'REDIS_URL=redis://default@redis:6379'
      - REDIS_PASSWORD=$SERVICE_PASSWORD_REDIS
      - 'REDIS_OPENSSL_VERIFY_MODE=${REDIS_OPENSSL_VERIFY_MODE:-none}'
      - 'POSTGRES_DATABASE=${POSTGRES_DB:-chatwoot}'
      - 'POSTGRES_HOST=${POSTGRES_HOST:-postgres}'
      - POSTGRES_USERNAME=$SERVICE_USER_POSTGRES
      - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
      - 'RAILS_MAX_THREADS=${RAILS_MAX_THREADS:-5}'
      - 'NODE_ENV=${NODE_ENV:-production}'
      - 'RAILS_ENV=${RAILS_ENV:-production}'
      - 'INSTALLATION_ENV=${INSTALLATION_ENV:-docker}'
      - 'ACTIVE_STORAGE_SERVICE=${ACTIVE_STORAGE_SERVICE:-local}'
      - 'FB_APP_ID=${FB_APP_ID}'
      - 'FB_APP_SECRET=${FB_APP_SECRET}'
    command:
      - bundle
      - exec
      - sidekiq
      - '-C'
      - config/sidekiq.yml
    volumes:
      - 'staging-rails-data:/app/storage'
    healthcheck:
      test:
        - CMD-SHELL
        - "bundle exec rails runner 'puts Sidekiq.redis(&:info)' > /dev/null 2>&1"
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: 'pgvector/pgvector:pg12'
    restart: always
    volumes:
      - 'staging-postgres-data:/var/lib/postgresql/data'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:-chatwoot}'
      - POSTGRES_USER=$SERVICE_USER_POSTGRES
      - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U $SERVICE_USER_POSTGRES -d chatwoot -h 127.0.0.1'
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: 'redis:alpine'
    restart: always
    command:
      - sh
      - '-c'
      - 'redis-server --requirepass "$SERVICE_PASSWORD_REDIS"'
    volumes:
      - 'staging-redis-data:/data'
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 20s
      retries: 10

volumes:
  staging-rails-data:
  staging-postgres-data:
  staging-redis-data:
